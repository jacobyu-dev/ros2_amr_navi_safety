integration_scenario_runner:
  ros__parameters:
    use_sim_time: true
    scenario_step_timeout_sec: 90.0
    stop_velocity_threshold: 0.02
    movement_velocity_threshold: 0.05
    recovery_valid_samples: 5
    stationary_samples: 5
    obstacle_distance_ahead: 0.95
    obstacle_entity_name: integration_test_obstacle
    obstacle_injection_enabled: true
    sensor_failure_enabled: true
    mission_start_service: /mission/start
    mission_resume_service: /mission/resume
    fault_service: /fake_lidar/set_fault_mode
    set_entity_pose_service: /world/amr_empty/set_pose

integration_test_navigate_to_pose_server:
  ros__parameters:
    use_sim_time: true
    navigate_action_name: /navigate_to_pose
    odom_topic: /odom
    cmd_vel_topic: /navigation/cmd_vel
    linear_speed: 0.35
    angular_speed: 0.8
    goal_position_tolerance: 0.25

safety_velocity_gate:
  ros__parameters:
    use_sim_time: true
    input_cmd_vel_topic: /navigation/cmd_vel
    output_cmd_vel_topic: /cmd_vel
    safety_topic: /safety/status
    publish_rate_hz: 50.0
    command_timeout_ms: 250
    safety_timeout_ms: 500

scan_fault_injector:
  ros__parameters:
    use_sim_time: true
    input_scan_topic: /scan/raw
    output_scan_topic: /scan
    set_fault_mode_service: /fake_lidar/set_fault_mode
    fault_event_topic: /safety/fault_injection/events
    slow_publish_period_ms: 2000
    stale_timestamp_offset_ms: 1000

mission_manager_node:
  ros__parameters:
    use_sim_time: true
    goal_frame: odom
    mission_goal_xs: [5.0]
    mission_goal_ys: [0.0]
    mission_goal_yaws: [0.0]
    require_safety_clear: true
